name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Test native-independent components
        run: >-
          npx tsx --test
          test/agent-output.test.ts test/agents.test.ts
          test/source-location.test.ts test/review-geometry.test.ts
          test/local-history.test.ts test/review.test.ts test/project-ignore.test.ts
          test/default-language.test.ts
